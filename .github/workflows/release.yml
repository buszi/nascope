name: Release

# Push a tag `vX.Y.Z` (a release candidate is `vX.Y.Z-rc1`, published as a pre-release) to build and publish.
# Android is built and tested on Ubuntu first; the expensive macOS runner starts only after that passed.
# Runbook: docs/release.md.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # SHA-256 of the release signing certificate (public; also in docs/release.md and the README).
  # The release fails if the APK is signed with anything else.
  EXPECTED_CERT_SHA256: 37b1bda5ad60020cb08f056765f402f0ac0c9034c8aa2042502279e37600cae2

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against app-version
        id: version
        run: |
          VERSION=$(sed -nE 's/^app-version *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml)
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          if [ -z "$VERSION" ] || [ "$BASE" != "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match app-version '$VERSION' in gradle/libs.versions.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :domain-model:jvmTest :storage:jvmTest :network:jvmTest :domain:jvmTest :shared:jvmTest

      - name: Decode the signing keystore
        env:
          # The secret holds the keystore base64-encoded (a secret cannot hold a file or a path).
          KEYSTORE_BASE64: ${{ secrets.NASCOPE_KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret NASCOPE_KEYSTORE_FILE is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nascope-release.jks"
          test -s "$RUNNER_TEMP/nascope-release.jks" || { echo "::error::NASCOPE_KEYSTORE_FILE did not decode to a keystore"; exit 1; }

      - name: Build the signed release APK
        env:
          NASCOPE_KEYSTORE_FILE: ${{ runner.temp }}/nascope-release.jks # the decoded file, not the secret
          NASCOPE_KEYSTORE_PASSWORD: ${{ secrets.NASCOPE_KEYSTORE_PASSWORD }}
          NASCOPE_KEY_ALIAS: ${{ secrets.NASCOPE_KEY_ALIAS }}
          NASCOPE_KEY_PASSWORD: ${{ secrets.NASCOPE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Verify the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          ACTUAL=$(sed -nE 's/.*certificate SHA-256 digest: *([0-9a-f]+).*/\1/p' "$RUNNER_TEMP/certs.txt" | head -1)
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The APK is signed with $ACTUAL, not the release key"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/Nascope-${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: android
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # One row per OS. Windows (msi) and Linux (deb) are left out until they have been tested by hand:
      # add a row with its runner, Gradle task and output folder (docs/release.md, "Adding an OS").
      matrix:
        include:
          - name: macOS
            runner: macos-latest # Apple Silicon: the dmg runs on Apple Silicon Macs only
            task: packageReleaseDmg
            folder: dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - name: Collect
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main-release/${{ matrix.folder }}/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum Nascope-* | tee SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nascope ${GITHUB_REF_NAME#v}" \
            --generate-notes $FLAGS

  homebrew:
    name: Update the Homebrew tap
    needs: publish
    # Release candidates (a tag with a suffix) never reach Homebrew.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the tap token
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret HOMEBREW_TAP_TOKEN is not set: the Homebrew tap is not updated"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: desktop-macOS
          path: dist

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump the cask
        if: steps.gate.outputs.run == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum "dist/Nascope-$VERSION.dmg" | cut -d' ' -f1)
          cd tap
          sed -i -E "s/^( *version )\".*\"/\1\"$VERSION\"/; s/^( *sha256 )\".*\"/\1\"$SHA\"/" Casks/nascope.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nascope.rb
          if git diff --cached --quiet; then
            echo "The cask is already up to date"
            exit 0
          fi
          git commit -m "nascope $VERSION"
          git push

