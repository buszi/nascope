name: Bug report
description: Something does not work or looks wrong
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Nascope version
      description: The release you installed, for example 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 8, Android 15 / MacBook Air M2, macOS 15
  - type: input
    id: glances
    attributes:
      label: Glances version and API
      description: Shown by `glances --version`; the API version is the one in the URL (v3 or v4)
      placeholder: Glances 4.3.1, API v4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Add a server ...\n2. Open the storage details ..."
  - type: markdown
    attributes:
      value: Please do not paste passwords or addresses you want to keep private. Screenshots are very welcome.
